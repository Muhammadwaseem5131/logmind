name: demo page

# Publishes the rendered demo to GitHub Pages so anyone can open a real
# analysed report without installing anything.
#
# Manual trigger only, until Pages is switched on:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# then Actions -> "demo page" -> Run workflow. Once that run is green, add
# the push trigger back and every commit republishes the demo:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to publish a broken build
        run: python logmind.py --test

      - name: Render the demo from the current samples
        run: |
          python build_demo.py
          mkdir -p _site
          cp demo.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
